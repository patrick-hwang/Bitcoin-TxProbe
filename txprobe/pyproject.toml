[project]
name = "txprobe"
version = "0.1.0"
description = "TxProbe: Bitcoin network topology inference via transaction propagation"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "python-socks[asyncio]>=2.4",
]

[project.optional-dependencies]
analysis = [
    "networkx>=3.0",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["txprobe*"]

