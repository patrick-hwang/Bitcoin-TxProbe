invblock:
  wait_time_sec: 8.0

tx_crafting:
  utxo_target_sats: 1500
  parent_fee_sats: 500
  marker_fee_sats: 500
  split_fee_rate_sat_vb: 2
  max_outputs_per_split_tx: 500
  max_source_size: 75
  poll_interval_sec: 10.0
  block_propagation_wait_sec: 15.0

txprobe_execution:
  invblock_wait_sec: 10.0
  flood_wait_sec: 1.0
  parent_wait_sec: 5.0
  marker_propagation_wait_sec: 10.0
  getdata_wait_sec: 15.0
  cleanup_wait_sec: 2.0

discovery:
  target_count: 0  # 0 means connect to all collected candidates
  crawling_time_sec: 600  # 10 minutes connection window
  poll_interval_sec: 5
  retry_interval_sec: 45  # periodically retry unconnected candidates every 45s
  clearnet_onetry_concurrency: 32
  tor_onetry_concurrency: 16
  max_addrman_age_days: 3

reachability:
  tor_proxy_host: "127.0.0.1"
  tor_proxy_port: 9050
  clearnet_timeout_sec: 10.0
  tor_timeout_sec: 60.0
  clearnet_concurrency: 50
  tor_concurrency: 20

dns_seeds:
  - seed.testnet4.bitcoin.sprovoost.nl
  - seed.testnet4.wiz.biz
